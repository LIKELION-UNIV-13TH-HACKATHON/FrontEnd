<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // URL 쿼리에서 값 받기
      const qs = new URLSearchParams(location.search);
      const appkey = qs.get("appkey"); // 필수
      const lat = parseFloat(qs.get("lat")) || 37.5665;
      const lng = parseFloat(qs.get("lng")) || 126.978;

      // SDK 동적 주입 (autoload=false 유지)
      const s = document.createElement("script");
      s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${appkey}&libraries=services&autoload=false`;
      s.onload = () => {
        kakao.maps.load(() => {
          const center = new kakao.maps.LatLng(lat, lng);
          const map = new kakao.maps.Map(document.getElementById("map"), {
            center,
            level: 3,
          });
          new kakao.maps.Marker({ position: center }).setMap(map);
        });
      };
      s.onerror = () => console.error("[kakao-map.html] SDK load failed");
      document.head.appendChild(s);
    </script>
  </body>
</html>
